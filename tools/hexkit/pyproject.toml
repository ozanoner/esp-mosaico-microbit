[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hexkit"
version = "0.1.0"
description = "Intel HEX geometry for micro:bit v1 partial flashing"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
hexkit = "hexkit:main"

[tool.setuptools]
py-modules = ["hexkit"]
package-dir = { "" = "." }

[tool.pytest.ini_options]
testpaths = ["tests"]
