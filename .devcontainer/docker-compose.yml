name: esp-mosaico-microbit

services:
  esp-idf:
    # The host already carries an ESP-IDF 6.2 image; override with IDF_IMAGE to pin a tag.
    image: ${IDF_IMAGE:-espressif/idf:latest}
    command: sleep infinity
    working_dir: /workspaces/esp-mosaico-microbit
    environment:
      IDF_CCACHE_ENABLE: "1"
    volumes:
      - ..:/workspaces/esp-mosaico-microbit:cached
      - idf-ccache:/root/.ccache
      # ESP-Iris host runtime that `mosaico.py doctor` bootstraps on first use
      - esp-iris-state:/root/.local/state/esp-mosaico
    # No `devices:` mappings on purpose: /dev/ttyUSB* and /dev/ttyACM* do not
    # exist on the build host and `docker compose up` fails when they are
    # declared. Flashing happens on cirunner, never from this container.

volumes:
  idf-ccache:
  esp-iris-state:
