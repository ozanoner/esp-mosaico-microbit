# One compose file for both halves of the system.
#
#   docker compose up -d build-service            # build box (PoC path, needs nothing else)
#   docker compose up -d mosaico-idf       # ESP-IDF toolchain for firmware work
#   docker compose run --rm build-service verify  # reproducibility check
#
# Only Docker is required on the host.
# No fixed project `name`: compose derives it from the checkout directory, so two
# clones on one machine (or a fresh clone beside an old one) never fight over the
# same containers and volumes.

services:
  # Speech-to-text sidecar. Not published to the host: the build service reaches
  # it as http://asr:8000 on the compose network, so nothing new is exposed on
  # the LAN and no ASR credential exists anywhere.
  asr:
    build:
      context: .
      dockerfile: asr/Dockerfile
    image: esp-mosaico-microbit/asr:local
    environment:
      MB_ASR_MODEL_DIR: /models
      MB_ASR_COMPUTE: int8
      MB_ASR_LANGUAGE: en
    restart: unless-stopped

  build-service:
    build:
      context: .
      dockerfile: build-service/Dockerfile
    image: esp-mosaico-microbit/build-service:local
    working_dir: /workspace
    volumes:
      - .:/workspace
    ports:
      # Host port is overridable; the container always listens on 8477.
      - "${BUILD_SERVICE_PORT:-8477}:8477"
    depends_on:
      - asr
    environment:
      MB_TOOLCHAIN_ID: mkc-1.3.6
      MB_PORT: "8477"
      # Passed through from the host .env only (gitignored, dockerignored).
      # Deliberately not env_file: .env also holds GITHUB_TOKEN, and the service
      # has no business seeing it.
      MB_ASR_BASE_URL: ${MB_ASR_BASE_URL:-http://asr:8000/v1}
      MB_ASR_API_KEY: ${MB_ASR_API_KEY:-}
      MB_ASR_MODEL: ${MB_ASR_MODEL:-base}
      MB_LLM_BASE_URL: ${MB_LLM_BASE_URL:-https://api.deepseek.com}
      # Accept the vendor-named variable too: DEEPSEEK_API_KEY is what a
      # DeepSeek-only setup naturally puts in .env.
      MB_LLM_API_KEY: ${MB_LLM_API_KEY:-${DEEPSEEK_API_KEY:-}}
      MB_LLM_MODEL: ${MB_LLM_MODEL:-deepseek-chat}

  mosaico-idf:
    # Pinned by digest: the floating `latest` tag is what this repo was validated
    # against (IDF 6.2.0, revision ab95e70748f2), but tags move.
    # Override with IDF_IMAGE=espressif/idf:<tag> when a build must move.
    image: ${IDF_IMAGE:-espressif/idf@sha256:6ad927cfb85a5fea82da64b00960b01adff4fc6019ffcdb18caa3da642d55343}
    command: sleep infinity
    working_dir: /workspace
    environment:
      IDF_CCACHE_ENABLE: "1"
    volumes:
      - .:/workspace:cached
      - idf-ccache:/root/.ccache
      - esp-iris-state:/root/.local/state/esp-mosaico
      # The GSP compiler is acquired into /root/.cache at configure time. Without
      # this volume a re-created container loses it while build/CMakeCache.txt
      # still points at the old path, and the next configure fails the esp-gsp
      # contract check.
      - esp-mosaico-cache:/root/.cache/esp-mosaico
    # No `devices:` entries here: a build host or CI has no board attached, and a
    # fixed node that does not exist makes `docker compose up` fail. To flash from
    # a workstation with the device plugged in, add the hardware overlay:
    #   docker compose -f compose.yaml -f compose.hw.yaml up -d mosaico-idf
    # See compose.hw.yaml for why it bind-mounts /dev instead of naming a node.

volumes:
  idf-ccache:
  esp-iris-state:
  esp-mosaico-cache:
