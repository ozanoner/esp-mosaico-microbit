[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "esp-mb-brain"
version = "0.1.0"
description = "Build service: MakeCode source -> micro:bit v1 hex with region hashes"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "pydantic>=2",
  "hexkit",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
mb-brain = "esp_mb_brain.app:run"

[tool.setuptools]
packages = ["esp_mb_brain"]

[tool.uv.sources]
hexkit = { path = "../tools/hexkit", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
