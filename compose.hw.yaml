# Hardware overlay: the two micro:bit-facing USB ports of the Mosaico, nothing else.
#
#   docker compose -f compose.yaml -f compose.hw.yaml up -d mosaico-idf
#
# Kept out of compose.yaml because a build host and CI have no board, and a
# `devices:` entry for a node that does not exist makes `docker compose up` fail.
#
# Deliberately NOT privileged and NOT a /dev bind mount: the container gets two
# character devices and the cgroup rule that lets it open them (ttyACM is major
# 166), and nothing else from the host.
#
# Known limitation, accepted for the PoC: these paths must exist when the
# container starts, and if the S31 re-enumerates onto a different number the
# mount goes stale — `docker compose up -d --force-recreate` re-creates it.

services:
  mosaico-idf:
    device_cgroup_rules:
      - 'c 166:* rmw'
    devices:
      - /dev/ttyACM0:/dev/ttyACM0
      - /dev/ttyACM1:/dev/ttyACM1
