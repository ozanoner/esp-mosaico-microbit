# Hardware overlay: USB access for a board attached to THIS machine.
#
#   docker compose -f compose.yaml -f compose.hw.yaml up -d mosaico-idf
#   docker compose -f compose.yaml -f compose.hw.yaml exec mosaico-idf bash
#
# Kept out of compose.yaml on purpose. A build host and CI have no board, and a
# fixed `devices:` entry for a node that does not exist makes `docker compose up`
# fail. This overlay is only used on a workstation with the device plugged in.
#
# `privileged` + a /dev bind mount, rather than `devices: /dev/ttyACM1`:
# the ESP32-S31 re-enumerates its USB interfaces on every reset, so a pinned
# device node disappears mid-operation. ESP-Iris follows the re-enumeration, and
# that needs the whole USB view, not one node.
#
# Scope: a dev machine only, never a shared or build host — privileged lifts the
# container's device and capability isolation.

services:
  mosaico-idf:
    privileged: true
    volumes:
      - /dev:/dev
      - /sys:/sys:ro
